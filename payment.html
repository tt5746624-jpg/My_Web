<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Payment Requests</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #07090e; color: #fff; padding: 20px; }
    .card { background: #11141c; border: 1px solid #222736; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
    input, button { padding: 8px 12px; border-radius: 8px; border: 1px solid #222736; margin-top: 8px; }
    input { background: #1a1e29; color: #fff; width: 100%; box-sizing: border-box; }
    button { background: #03c4f5; color: #000; font-weight: bold; cursor: pointer; border: none; }
    .status { font-weight: bold; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
    .pending { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
    .approved { background: rgba(34, 197, 94, 0.2); color: #22c55e; }
  </style>
</head>
<body>

  <h2>Payment Requests Admin Panel</h2>
  <div id="requestList">Loading requests...</div>

<script>
  // ⚠️ Supabase Dashboard > Project Settings > API မ်ှ eyJ... ဖြစ်သော anon key အမှန်ကို ထည့်ပါ
  const SUPABASE_URL = "https://ygaiynlhkkduwtcayeyna.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_3rjPh6MR2ZRMfJt67_5dzg_ugAsNgu-"; 

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function loadRequests() {
    const { data, error } = await supabaseClient
      .from('payment_requests')
      .select('*')
      .order('created_at', { ascending: false });

    const listDiv = document.getElementById('requestList');
    if (error) {
      listDiv.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
      return;
    }

    if (!data || data.length === 0) {
      listDiv.innerHTML = "<p>No requests found.</p>";
      return;
    }

    listDiv.innerHTML = data.map(req => `
      <div class="card">
        <div><strong>Device ID:</strong> ${req.device_id}</div>
        <div><strong>Telegram:</strong> ${req.tg_user || '-'}</div>
        <div><strong>Requested Pay Name:</strong> ${req.pay_name || '-'}</div>
        <div><strong>Status:</strong> <span class="status ${req.status}">${req.status}</span></div>
        
        ${req.status === 'pending' ? `
          <div style="margin-top:10px;">
            <input type="text" id="qr_${req.id}" placeholder="QR Code Image URL ထည့်ပါ">
            <button onclick="approveRequest(${req.id})">Approve & Send QR</button>
          </div>
        ` : `
          <div style="margin-top:8px; font-size:12px; color:#94a3b8;">
            QR URL: <a href="${req.qr_url}" target="_blank" style="color:#03c4f5;">View QR</a>
          </div>
        `}
      </div>
    `).join('');
  }

  async function approveRequest(id) {
    const qrUrl = document.getElementById(`qr_${id}`).value.trim();
    if (!qrUrl) return alert("QR Code Image URL ထည့်သွင်းပေးပါ။");

    const { error } = await supabaseClient
      .from('payment_requests')
      .update({
        status: 'approved',
        qr_url: qrUrl
      })
      .eq('id', id);

    if (error) {
      alert("Approve မအောင်မြင်ပါ: " + error.message);
    } else {
      alert("Approved အောင်မြင်ပါပြီ!");
      loadRequests();
    }
  }

  loadRequests();
  // ၅ စက္ကန့်တစ်ကြိမ် Auto refresh လုပ်ပေးမည်
  setInterval(loadRequests, 5000);
</script>
</body>
</html>
