<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Xoni Tools · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  :root {
    --bg: #07090e;
    --surface: #11141c;
    --surface-glass: rgba(17, 20, 28, 0.7);
    --surface-2: #1a1e29;
    --line: #222736;
    --cyan: #03c4f5;
    --cyan-glow: rgba(3, 196, 245, 0.15);
    --violet: #8b6bf7;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --muted-2: #64748b;
    --amber: #fbbf24;
    --green: #22c55e;
    --font-main: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-main); min-height: 100vh; padding-bottom: 80px; position: relative; }
  .page { position: relative; z-index: 1; max-width: 520px; margin: 0 auto; padding: 0 16px; }

  /* Header */
  .header { padding: 28px 4px 16px; display: flex; align-items: center; gap: 18px; }
  .icon-wrap { width: 80px; height: 80px; flex-shrink: 0; border-radius: 20px; background: linear-gradient(135deg, var(--cyan), var(--violet)); padding: 2px; }
  .app-icon { width: 100%; height: 100%; border-radius: 18px; object-fit: cover; display: block; background: var(--surface-2); }
  .app-info h1 { font-size: 24px; font-weight: 800; }
  .app-info .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  /* Buttons & Cards */
  .install-btn { width: 100%; padding: 15px; border-radius: 16px; border: none; background: linear-gradient(135deg, #03c4f5, #0284c7); color: #021520; font-weight: 800; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .req-status-box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 20px; }
  .req-btn-trigger { width: 100%; background: rgba(3, 196, 245, 0.08); border: 1px dashed var(--cyan); color: var(--cyan); padding: 12px; border-radius: 14px; font-weight: 700; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }

  /* Modals */
  .modal-overlay { position: fixed; inset: 0; background: rgba(3, 5, 9, 0.85); backdrop-filter: blur(12px); z-index: 1000; opacity: 0; pointer-events: none; transition: 0.25s; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; width: 100%; max-width: 450px; padding: 22px; position: relative; }
  .modal-close { position: absolute; top: 18px; right: 18px; background: var(--surface-2); border: none; color: var(--muted); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

  .input-group { margin-bottom: 12px; }
  .input-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .input-group input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--text); outline: none; }
</style>
</head>
<body>

<div class="page">
  <header class="header">
    <div class="icon-wrap"><img src="" id="appIcon" class="app-icon"></div>
    <div class="app-info">
      <h1 id="appName">Xoni Tool</h1>
      <p class="sub">Dashboard</p>
    </div>
  </header>

  <div id="requestProgressSection"></div>
</div>

<div class="modal-overlay" id="reqModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('reqModal')"><i class="fas fa-times"></i></button>
    <h3 style="font-size:18px; font-weight:800;">Request Custom Payment</h3>
    <p style="font-size:12px; color:var(--muted); margin-top:4px; margin-bottom:14px;">လိုချင်သော Payment နာမည်ထည့်ပါ။ Admin မှ QR ပေးပို့ပေးပါမည်။</p>

    <div class="input-group"><label>Device ID</label><input type="text" id="reqDeviceId" placeholder="Device ID"></div>
    <div class="input-group"><label>Telegram Username</label><input type="text" id="reqTgUser" placeholder="@username"></div>
    <div class="input-group"><label>Requested Payment Name</label><input type="text" id="reqPayName" placeholder="e.g. AYA Pay, CB Pay"></div>

    <button class="install-btn" id="submitReqBtn" style="margin-top:10px;">Send Request to Admin</button>
  </div>
</div>

<script>
  // ⚠️ Supabase Dashboard > Project Settings > API မ်ှ eyJ... ဖြစ်သော anon key အမှန်ကို ထည့်ပါ
  const SUPABASE_URL = "https://ygaiynlhkkduwtcayeyna.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_3rjPh6MR2ZRMfJt67_5dzg_ugAsNgu-"; 

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Send Request
  document.getElementById('submitReqBtn').onclick = async function() {
    const deviceId = document.getElementById('reqDeviceId').value.trim();
    const tgUser = document.getElementById('reqTgUser').value.trim();
    const payName = document.getElementById('reqPayName').value.trim();

    if(!deviceId || !tgUser || !payName) return alert("အချက်အလက် အားလုံး ဖြည့်ပါ");

    this.disabled = true;

    const { data, error } = await supabaseClient
      .from('payment_requests')
      .insert([{ device_id: deviceId, tg_user: tgUser, pay_name: payName, status: 'pending' }]);

    this.disabled = false;

    if (error) {
      alert("Error: " + error.message);
    } else {
      localStorage.setItem('xoni_pay_req', JSON.stringify({ deviceId, payName }));
      closeModal('reqModal');
      checkRequestStatus();
      alert("Request အောင်မြင်စွာ ပို့ဆောင်ပြီးပါပြီ!");
    }
  };

  // Check Status Logic
  async function checkRequestStatus() {
    const container = document.getElementById('requestProgressSection');
    const savedReq = JSON.parse(localStorage.getItem('xoni_pay_req') || 'null');

    if(!savedReq || !savedReq.deviceId) {
      container.innerHTML = `
        <button class="req-btn-trigger" onclick="openModal('reqModal')">
          <i class="fas fa-plus-circle"></i> Request Custom Payment Method
        </button>`;
      return;
    }

    const { data, error } = await supabaseClient
      .from('payment_requests')
      .select('*')
      .eq('device_id', savedReq.deviceId.trim())
      .order('created_at', { ascending: false })
      .limit(1)
      .maybeSingle();

    if (error || !data) {
      container.innerHTML = `
        <div class="req-status-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; font-size:14px;">${savedReq.payName} Request</span>
            <span style="background:rgba(251,191,36,0.15); color:var(--amber); border:1px solid var(--amber); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700;"><i class="fas fa-spinner fa-spin"></i> Pending Admin QR</span>
          </div>
          <p style="font-size:11px; color:var(--muted); margin-top:6px;">Admin သို့ Request ရောက်ရှိသွားပါပြီ။ Admin မှ QR ထည့်ပေးလျှင် ဤနေရာတွင် ပေါ်လာပါမည်။</p>
          <div style="text-align:center; margin-top:8px;"><a href="#" onclick="localStorage.removeItem('xoni_pay_req'); checkRequestStatus();" style="color:var(--muted); font-size:11px;">Cancel Request</a></div>
        </div>`;
      return;
    }

    if (data.status === 'approved' && data.qr_url) {
      container.innerHTML = `
        <div class="req-status-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; color:var(--cyan); font-size:14px;">${data.pay_name || savedReq.payName} QR Ready</span>
            <span style="background:rgba(34,197,94,0.15); color:var(--green); border:1px solid var(--green); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700;">Approved</span>
          </div>
          <p style="font-size:11px; color:var(--muted); margin-top:6px;">Admin မှ QR Link ထည့်ပေးပြီးပါပြီ။ ငွေချေရန် Scan ဖတ်ပါ။</p>
          <div style="text-align:center; margin-top:10px;">
            <img src="${data.qr_url}" style="width:160px; height:160px; border-radius:12px; border:1px solid var(--line); object-fit:cover;">
          </div>
          <div style="text-align:center; margin-top:8px;"><a href="#" onclick="localStorage.removeItem('xoni_pay_req'); checkRequestStatus();" style="color:var(--muted); font-size:11px;">Request အသစ်လုပ်မည်</a></div>
        </div>`;
    } else {
      container.innerHTML = `
        <div class="req-status-box">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; font-size:14px;">${savedReq.payName} Request</span>
            <span style="background:rgba(251,191,36,0.15); color:var(--amber); border:1px solid var(--amber); padding:2px 8px; border-radius:20px; font-size:10px; font-weight:700;"><i class="fas fa-spinner fa-spin"></i> Pending Admin QR</span>
          </div>
          <p style="font-size:11px; color:var(--muted); margin-top:6px;">Admin သို့ Request ရောက်ရှိသွားပါပြီ။ Admin မှ QR ထည့်ပေးလျှင် ဤနေရာတွင် ပေါ်လာပါမည်။</p>
          <div style="text-align:center; margin-top:8px;"><a href="#" onclick="localStorage.removeItem('xoni_pay_req'); checkRequestStatus();" style="color:var(--muted); font-size:11px;">Cancel Request</a></div>
        </div>`;
    }
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }

  checkRequestStatus();
  // ၃ စက္ကန့်တစ်ကြိမ် Auto စစ်ပေးမည်
  setInterval(checkRequestStatus, 3000);
</script>
</body>
</html>
