<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XoniTools</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Theme Tokens with Glassmorphism Support --- */
        :root {
            /* Dark Theme (Yellow/Black) */
            --m3-bg: #0c0b09; /* Deeper black for blur contrast */
            --m3-on-bg: #EAE2D3;
            
            /* Glass Colors (Translucent) */
            --m3-glass: rgba(30, 28, 22, 0.55);
            --m3-glass-raised: rgba(43, 40, 34, 0.65);
            --m3-glass-border: rgba(255, 255, 255, 0.08);
            
            --m3-primary: #D9C93B;
            --m3-on-primary: #373100;
            
            --m3-outline: #959080;
            --m3-error: #FFB4AB;
            --m3-success: #6DD58C;
        }

        [data-theme="light"] {
            /* Light Theme */
            --m3-bg: #f4f2ec;
            --m3-on-bg: #1D1B16;
            
            /* Glass Colors (Translucent) */
            --m3-glass: rgba(255, 255, 255, 0.6);
            --m3-glass-raised: rgba(255, 255, 255, 0.8);
            --m3-glass-border: rgba(0, 0, 0, 0.06);
            
            --m3-primary: #6A5F00;
            --m3-on-primary: #FFFFFF;
            
            --m3-outline: #7B7768;
            --m3-error: #BA1A1A;
            --m3-success: #146C2E;
        }

        body {
            font-family: 'Roboto', 'Padauk', sans-serif;
            background: var(--m3-bg);
            color: var(--m3-on-bg);
            min-height: 100vh;
            line-height: 1.5;
            transition: 0.3s ease;
            position: relative;
        }

        /* --- Ambient Background for Blur Effect --- */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
        }
        .orb-1 {
            width: 400px; height: 400px;
            background: rgba(217, 201, 59, 0.15); /* Yellow tint */
            top: -10%; left: -20%;
        }
        .orb-2 {
            width: 500px; height: 500px;
            background: rgba(217, 201, 59, 0.1);
            bottom: -20%; right: -20%;
        }

        /* --- Glass Utility Class --- */
        .glass-panel {
            background: var(--m3-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--m3-glass-border);
        }

        /* --- Layout --- */
        .app-wrapper {
            max-width: 680px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .cover-image-container {
            width: 100%;
            height: 280px;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            overflow: hidden;
        }
        .cover-image-container::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, var(--m3-bg) 100%);
        }
        .cover-image { width: 100%; height: 100%; object-fit: cover; }

        /* --- Top App Bar (Glass) --- */
        .top-app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.2); /* Transparent to let cover image show */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .app-bar-title {
            font-size: 20px; font-weight: 500;
            color: #ffffff; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .icon-actions { display: flex; gap: 8px; }
        .m3-icon-btn {
            width: 44px; height: 44px;
            border-radius: 50%; border: none;
            background: rgba(255,255,255,0.1); 
            backdrop-filter: blur(8px);
            color: #ffffff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        .m3-icon-btn:hover { background: rgba(255,255,255,0.2); }
        .m3-icon-btn svg { width: 22px; height: 22px; }

        [data-theme="dark"] .sun-icon, [data-theme="light"] .moon-icon, 
        [lang-current="en"] .lang-mm, [lang-current="my"] .lang-en { display: none; }
        .lang-text { font-size: 15px; font-weight: 500; }

        /* --- Main Content --- */
        .main-content {
            position: relative; z-index: 10;
            padding: 0 16px; margin-top: 120px; 
        }

        /* --- App Info Card (Glass) --- */
        .app-info-card {
            border-radius: 28px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.2);
            margin-bottom: 24px;
            animation: slideUp 0.6s ease;
        }
        .app-info-header { display: flex; gap: 20px; margin-bottom: 24px; }
        .app-icon {
            width: 96px; height: 96px;
            border-radius: 22px; object-fit: cover;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .app-meta-text { display: flex; flex-direction: column; justify-content: center; }
        .app-title {
            font-size: 28px; font-weight: 700;
            margin-bottom: 10px; line-height: 1.2;
        }
        .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
        .m3-chip {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px;
            background: var(--m3-glass-raised);
            border-radius: 12px;
            font-size: 13px; font-weight: 500;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-online { color: var(--m3-success); }
        .status-online .status-dot { background: var(--m3-success); }
        .status-offline { color: var(--m3-error); }
        .status-offline .status-dot { background: var(--m3-error); }

        /* --- Download Button --- */
        .m3-download-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            width: 100%; height: 52px;
            border-radius: 26px; 
            background: var(--m3-primary); color: var(--m3-on-primary);
            font-size: 16px; font-weight: 600; text-decoration: none;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(217, 201, 59, 0.2);
        }
        .m3-download-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .m3-download-btn.disabled {
            background: var(--m3-glass-raised); color: var(--m3-outline);
            pointer-events: none; box-shadow: none;
        }

        /* --- Features Card (Replaced What's New) --- */
        .features-card {
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 24px;
            animation: slideUp 0.8s ease;
        }
        .features-header {
            font-size: 18px; font-weight: 600;
            color: var(--m3-primary);
            margin-bottom: 20px;
            display: flex; align-items: center; gap: 12px;
        }
        .features-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .feature-item {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            padding: 16px;
            background: var(--m3-glass-raised);
            border-radius: 16px;
            transition: 0.3s;
        }
        .feature-item:hover {
            transform: translateX(4px);
            border-color: var(--m3-primary);
        }
        .feature-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: rgba(217, 201, 59, 0.15);
            color: var(--m3-primary);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .feature-text h4 {
            font-size: 15px; font-weight: 600;
            margin-bottom: 4px;
        }
        .feature-text p {
            font-size: 13px; color: var(--m3-outline);
            line-height: 1.5;
        }

        /* --- Drawer (Glass) --- */
        .drawer-scrim {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.5);
            z-index: 200; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .drawer-scrim.open { opacity: 1; visibility: visible; }
        .m3-drawer {
            position: fixed; top: 0; right: 0;
            width: 320px; height: 100%;
            z-index: 201; transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
            border-radius: 24px 0 0 24px;
            display: flex; flex-direction: column;
        }
        .m3-drawer.open { transform: translateX(0); }
        .drawer-header {
            padding: 32px 24px 24px;
            font-size: 22px; font-weight: 600;
            border-bottom: 1px solid var(--m3-glass-border);
        }
        .drawer-body { padding: 16px; overflow-y: auto; }
        .drawer-label {
            padding: 16px 16px 8px;
            font-size: 12px; font-weight: 700;
            color: var(--m3-primary); text-transform: uppercase; letter-spacing: 1.5px;
        }
        .drawer-nav-item {
            display: flex; align-items: center; gap: 16px;
            padding: 0 16px; height: 56px; border-radius: 16px;
            color: var(--m3-on-bg); text-decoration: none; font-size: 15px; font-weight: 500;
            transition: 0.2s; margin-bottom: 4px;
        }
        .drawer-nav-item:hover { background: var(--m3-glass-raised); }
        .drawer-nav-icon { color: var(--m3-outline); }
        .drawer-nav-item:hover .drawer-nav-icon { color: var(--m3-primary); }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .footer { text-align: center; padding: 24px; color: var(--m3-outline); font-size: 13px; }
    </style>
</head>

        const appData = {

                {

                    titleEN: "High Security", descEN: "Safe and secure data encryption.",

        };

        // --- 2. Translation Dictionary ---
        const i18n = {
            en: {
                menuTitle: "Menu", community: "Community", telegramChannel: "Telegram Channel",
                telegramGroup: "Telegram Group", direct: "Direct", connectMe: "Connect Me",
                statusAvail: "Available", statusUnavail: "Unavailable",
                btnDownload: "Download Now", btnNotAvail: "Not Available",
                featuresTitle: "Key Features", footerText: "&copy; 2026 XoniTools. All rights reserved."

                menuTitle: "မီနူး", community: "ကွန်မြူနတီ", telegramChannel: "Telegram ချန်နယ်",
                telegramGroup: "Telegram ဂရု", direct: "တိုက်ရိုက်ဆက်သွယ်ရန်", connectMe: "ဆက်သွယ်ရန်",
                statusAvail: "ရရှိနိုင်ပါသည်", statusUnavail: "မရရှိနိုင်ပါ",
                btnDownload: "ယခုဒေါင်းလုဒ်ဆွဲရန်", btnNotAvail: "လောလောဆယ်မရနိုင်ပါ",

            }
        };

        function toggleTheme() {
            const html = document.documentElement;
            const currentTheme = html.getAttribute('data-theme');
            const nextTheme = currentTheme === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', nextTheme);
            localStorage.setItem('theme', nextTheme);
        }

        function toggleLanguage() {
            const body = document.body;
            const currentLang = body.getAttribute('lang-current');
            const nextLang = currentLang === 'en' ? 'my' : 'en';
            body.setAttribute('lang-current', nextLang);
            localStorage.setItem('lang', nextLang);
            updateUITexts(nextLang);
            render(appData, nextLang); 
        }

        function updateUITexts(lang) {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[lang][key]) el.innerHTML = i18n[lang][key];
            });
        }

        function toggleDrawer(show) {
            document.getElementById('drawer').classList.toggle('open', show);
            document.getElementById('drawerScrim').classList.toggle('open', show);
            document.body.style.overflow = show ? 'hidden' : '';
        }

        function render(data, currentLang) {
            const wrapper = document.getElementById('appWrapper');
            const main = document.getElementById('mainContent');
            const dict = i18n[currentLang];
            
            if (data.telegramChannel) document.getElementById('linkChannel').href = data.telegramChannel;
            if (data.telegramGroup) document.getElementById('linkGroup').href = data.telegramGroup;
            if (data.connectMe) document.getElementById('linkConnect').href = data.connectMe;

            if (!document.getElementById('headerCover') && data.bannerImage) {
                const cover = document.createElement('div');
                cover.className = 'cover-image-container';
                cover.id = 'headerCover';
                cover.innerHTML = `<img src="${data.bannerImage}" class="cover-image" alt="Cover">`;
                wrapper.prepend(cover);
            }

            const isAvail = data.isAvailable === true;
            const statusClass = isAvail ? 'status-online' : 'status-offline';
            const statusText = isAvail ? dict.statusAvail : dict.statusUnavail;
            const btnClass = isAvail ? 'm3-download-btn' : 'm3-download-btn disabled';
            const btnText = isAvail ? dict.btnDownload : dict.btnNotAvail;
            const btnHref = isAvail ? `href="${data.downloadLink}" target="_blank"` : '';
            const btnIcon = isAvail 
                ? `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>`
                : `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>`;

            // Render Features dynamically based on language
            const featuresHTML = data.features.map(f => `
                <div class="feature-item">
                    <div class="feature-icon"><svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20">${f.icon}</svg></div>
                    <div class="feature-text">
                        <h4>${currentLang === 'en' ? f.titleEN : f.titleMM}</h4>
                        <p>${currentLang === 'en' ? f.descEN : f.descMM}</p>
                    </div>
                </div>
            `).join('');

            main.innerHTML = `
                <div class="app-info-card glass-panel">
                    <div class="app-info-header">
                        <img src="${data.appIcon}" alt="${data.appName}" class="app-icon">
                        <div class="app-meta-text">
                            <h1 class="app-title">${data.appName}</h1>
                            <div class="chip-group">
                                <span class="m3-chip">v${data.version}</span>
                                <span class="m3-chip ${statusClass}"><div class="status-dot"></div>${statusText}</span>
                                <span class="m3-chip">${data.fileSize}</span>
                            </div>
                        </div>
                    </div>
                    <a ${btnHref} class="${btnClass}">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="20">${btnIcon}</svg>
                        ${btnText}
                    </a>
                </div>

                <div class="features-card glass-panel">
                    <div class="features-header">
                        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
                        ${dict.featuresTitle}
                    </div>
                    <div class="features-grid">
                        ${featuresHTML}
                    </div>
                </div>
            `;
        }

        function init() {
            const currentLang = document.body.getAttribute('lang-current');
            updateUITexts(currentLang);
            render(appData, currentLang);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
