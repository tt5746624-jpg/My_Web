:root{
  color-scheme:light;
  --paper:#f3f0e6;
  --surface:#fffdf8;
  --surface-2:#e8e6dc;
  --ink:#171917;
  --muted:#65706c;
  --line:#d7d3c7;
  --accent:#2e52e3;
  --accent-ink:#fff;
  --coral:#ff6d48;
  --lime:#d7f36b;
  --shadow:0 22px 60px rgba(25,31,24,.10);
  --mono:'IBM Plex Mono','Roboto Mono',monospace;
  --display:'Space Grotesk','Roboto','Padauk',sans-serif;
}
[data-theme="dark"]{
  color-scheme:dark;
  --paper:#111512;
  --surface:#1b211c;
  --surface-2:#222a24;
  --ink:#f5f3e9;
  --muted:#aab3a8;
  --line:#343e36;
  --accent:#9db0ff;
  --accent-ink:#10162f;
  --coral:#ff805d;
  --lime:#d7f36b;
  --shadow:0 22px 60px rgba(0,0,0,.32);
}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--display);min-height:100vh;line-height:1.55;overflow-x:hidden;transition:background .25s ease,color .25s ease}
body,button,a{font-family:var(--display)}
a{color:inherit}
button{color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--coral);outline-offset:4px}
::selection{background:var(--lime);color:#171917}
.announcement-strip{min-height:34px;padding:6px 16px;background:var(--ink);color:var(--paper);text-align:center;font:600 10px/1.7 var(--mono);letter-spacing:.12em;text-transform:uppercase}
.announcement-strip span{color:var(--lime);margin:0 8px}
.site-shell{width:min(100% - 48px,1240px);margin:0 auto;position:relative}
.site-header{min-height:88px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;border-bottom:1px solid var(--line);gap:24px;position:relative;z-index:20}
.brand{display:inline-flex;align-items:center;gap:11px;text-decoration:none;width:max-content}
.brand-mark{width:40px;height:40px;object-fit:cover;border-radius:12px;background:#090909;border:1px solid var(--line)}
.brand-name{font-size:17px;font-weight:800;letter-spacing:-.06em;line-height:1}
.brand-name small{font:500 10px var(--mono);letter-spacing:.08em;color:var(--muted);margin-left:4px}
.desktop-nav{display:flex;align-items:center;gap:28px}
.desktop-nav a{font:600 11px var(--mono);letter-spacing:.04em;text-decoration:none;color:var(--muted);transition:color .18s ease}
.desktop-nav a:hover,.desktop-nav a[aria-current="page"]{color:var(--ink)}
.header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px}
.header-icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:transform .2s ease,border-color .2s ease,background .2s ease}
.header-icon-btn:hover{transform:translateY(-2px);border-color:var(--ink)}
.header-icon-btn svg{width:17px;height:17px}
.header-icon-btn .sun-icon{display:none}
[data-theme="dark"] .header-icon-btn .sun-icon{display:block}
[data-theme="dark"] .header-icon-btn .moon-icon{display:none}
.lang-text{font:700 10px var(--mono);letter-spacing:.04em}
#menuBtn{display:none}
.drawer-scrim{position:fixed;inset:0;background:rgba(10,14,10,.56);z-index:40;opacity:0;visibility:hidden;transition:.25s}
.drawer-scrim.open{opacity:1;visibility:visible}
.m3-drawer{position:fixed;z-index:41;top:0;right:0;width:min(390px,88vw);height:100dvh;padding:26px;background:var(--paper);border-left:1px solid var(--line);transform:translateX(101%);transition:transform .32s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.m3-drawer.open{transform:translateX(0)}
.drawer-header{font-size:24px;font-weight:700;letter-spacing:-.05em;padding:10px 4px 24px;border-bottom:1px solid var(--line)}
.drawer-body{padding-top:18px;overflow:auto}
.drawer-label{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:22px 8px 8px}
.drawer-nav-item{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;text-decoration:none;border:1px solid transparent;border-radius:10px;font-size:14px;font-weight:600;transition:background .18s,border-color .18s}
.drawer-nav-item:hover{background:var(--surface);border-color:var(--line)}
.drawer-nav-icon{color:var(--accent)}
.main-content{padding:46px 0 0}
.hero-section{display:grid;grid-template-columns:minmax(0,1.03fr) minmax(390px,.97fr);gap:clamp(36px,7vw,104px);align-items:center;min-height:590px;padding:36px 0 58px;border-bottom:1px solid var(--line)}
.hero-copy{position:relative;z-index:2;max-width:610px}
.hero-eyebrow,.section-kicker,.visual-label,.feature-number,.meta-label{font:700 10px var(--mono);letter-spacing:.15em;text-transform:uppercase}
.hero-eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);margin-bottom:26px}
.hero-eyebrow::before{content:"";display:block;width:8px;height:8px;background:var(--coral);border-radius:50%;box-shadow:0 0 0 4px color-mix(in srgb,var(--coral) 18%,transparent)}
.hero-title{font-size:clamp(56px,8vw,106px);line-height:.91;letter-spacing:-.09em;font-weight:700;margin:0;max-width:700px}
.hero-title em{font-style:normal;color:var(--accent);display:block}
.hero-description{font-size:clamp(15px,1.45vw,18px);line-height:1.75;color:var(--muted);max-width:470px;margin:28px 0 26px}
.hero-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.m3-download-btn{min-height:54px;padding:0 22px;display:inline-flex;justify-content:center;align-items:center;gap:11px;text-decoration:none;background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;font:700 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;box-shadow:5px 5px 0 var(--ink);transition:transform .18s,box-shadow .18s,filter .18s}
.m3-download-btn svg{width:17px;height:17px}
.m3-download-btn:hover{transform:translate(2px,2px);box-shadow:3px 3px 0 var(--ink);filter:saturate(1.12)}
.m3-download-btn:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
.m3-download-btn.disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);pointer-events:none;box-shadow:none}
.text-link{display:inline-flex;align-items:center;gap:9px;text-decoration:none;font:700 11px var(--mono);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--ink);padding:8px 0}
.text-link span{color:var(--coral);font-size:17px;transition:transform .2s}
.text-link:hover span{transform:translateX(4px)}
.hero-meta{display:flex;gap:0;margin-top:42px;padding-top:18px;border-top:1px solid var(--line);max-width:480px}
.hero-meta-item{padding:0 22px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
.hero-meta-item:first-child{padding-left:0;border-left:0}
.meta-label{font-size:9px;color:var(--muted)}
.meta-value{font-size:13px;font-weight:700}
.hero-visual{min-height:540px;position:relative;background:#d9e0fb;overflow:hidden;border-radius:5px;isolation:isolate}
[data-theme="dark"] .hero-visual{background:#273461}
.hero-visual::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(23,25,23,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(23,25,23,.075) 1px,transparent 1px);background-size:28px 28px;z-index:-1}
.hero-visual::after{content:"";position:absolute;width:270px;height:270px;border-radius:50%;background:var(--coral);right:-92px;top:-103px;z-index:-1}
.visual-index{position:absolute;top:22px;left:24px;font:700 10px var(--mono);letter-spacing:.15em;color:#171917}
.visual-index strong{color:var(--accent);font-size:15px}
.visual-orbit{position:absolute;width:390px;height:390px;border:1px solid rgba(23,25,23,.25);border-radius:50%;left:50%;top:51%;transform:translate(-50%,-50%)}
.visual-orbit::before,.visual-orbit::after{content:"";position:absolute;border:1px solid rgba(23,25,23,.18);border-radius:50%;inset:30px}
.visual-orbit::after{inset:72px}
.phone-shell{position:absolute;left:50%;top:51%;transform:translate(-50%,-50%) rotate(-4deg);height:min(430px,77%);aspect-ratio:.49;padding:8px;background:#151715;border:2px solid #f7f5ec;border-radius:34px;box-shadow:18px 22px 0 rgba(23,25,23,.16),0 30px 60px rgba(19,30,58,.25);z-index:2}
.phone-screen{width:100%;height:100%;object-fit:cover;display:block;border-radius:26px;background:#f5f3e9}
.phone-speaker{position:absolute;z-index:3;left:50%;top:10px;transform:translateX(-50%);width:36%;height:11px;border-radius:99px;background:#151715}
.visual-app-mark{position:absolute;right:24px;bottom:24px;width:74px;height:74px;object-fit:cover;border:4px solid var(--paper);border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(0,0,0,.18);z-index:4}
.visual-card{position:absolute;left:24px;bottom:24px;z-index:4;padding:13px 15px;background:var(--surface);border:1px solid var(--ink);box-shadow:4px 4px 0 var(--ink);min-width:150px}
.visual-card .visual-label{display:block;font-size:8px;color:var(--muted);margin-bottom:5px}
.visual-card strong{font-size:16px;letter-spacing:-.04em}
.visual-card span:last-child{color:var(--coral)}
.visual-side-note{position:absolute;right:18px;top:92px;writing-mode:vertical-rl;font:700 9px var(--mono);letter-spacing:.18em;color:#171917}
.hero-ribbon{display:inline-flex;align-items:center;gap:8px;position:absolute;right:76px;bottom:47px;z-index:3;transform:rotate(-7deg);padding:8px 12px;background:var(--lime);color:#171917;border:1px solid #171917;font:700 9px var(--mono);text-transform:uppercase;letter-spacing:.08em}
.hero-ribbon::before{content:"✳";font-size:14px}
.toolkit-band{display:grid;grid-template-columns:1.2fr repeat(3,1fr);align-items:center;margin:0;padding:28px 0 32px;border-bottom:1px solid var(--line);gap:20px}
.band-intro{font-size:14px;font-weight:700;letter-spacing:-.02em}
.band-stat{border-left:1px solid var(--line);padding-left:22px}
.band-stat strong{display:block;font-size:17px;line-height:1.2}
.band-stat span{display:block;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.features-card{padding:82px 0 88px;border-bottom:1px solid var(--line)}
.features-header{display:grid;grid-template-columns:.8fr 1.2fr;align-items:end;gap:32px;margin-bottom:36px}
.section-kicker{color:var(--accent);display:block;margin-bottom:12px}
.features-heading{font-size:clamp(34px,5vw,60px);line-height:1;letter-spacing:-.07em;margin:0;max-width:520px}
.features-subtitle{color:var(--muted);max-width:390px;margin:0 0 5px;font-size:14px;line-height:1.8}
.features-grid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.feature-item{min-height:215px;padding:24px 24px 26px 0;border-right:1px solid var(--line);transition:background .2s,transform .2s}
.feature-item:not(:first-child){padding-left:24px}
.feature-item:last-child{border-right:0}
.feature-item:hover{background:color-mix(in srgb,var(--accent) 5%,transparent);transform:translateY(-3px)}
.feature-icon{width:45px;height:45px;border:1px solid var(--line);background:var(--surface);color:var(--accent);display:grid;place-items:center;margin-bottom:30px;border-radius:12px}
.feature-icon svg{width:22px;height:22px}
.feature-number{display:block;color:var(--coral);font-size:9px;margin-bottom:7px}
.feature-text h4{margin:0 0 8px;font-size:18px;letter-spacing:-.04em}
.feature-text p{margin:0;color:var(--muted);font-size:13px;line-height:1.75;max-width:300px}
.content-section{padding:78px 0;border-bottom:1px solid var(--line);scroll-margin-top:90px}
.section-heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}
.section-heading h2{margin:0;font-size:clamp(34px,5vw,58px);line-height:1;letter-spacing:-.07em}
.section-heading p{margin:0 0 4px;max-width:290px;color:var(--muted);font-size:13px;line-height:1.7}
.gallery-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.gallery-item{padding:7px;background:var(--surface);border:1px solid var(--line);border-radius:4px;cursor:zoom-in;overflow:hidden;text-align:left;transition:transform .22s,box-shadow .22s,border-color .22s}
.gallery-item:nth-child(even){transform:translateY(20px)}
.gallery-item:hover{transform:translateY(-4px) rotate(-1deg);border-color:var(--accent);box-shadow:var(--shadow)}
.gallery-item:nth-child(even):hover{transform:translateY(16px) rotate(1deg)}
.gallery-item img{display:block;width:100%;aspect-ratio:.72;object-fit:cover;background:var(--surface-2)}
.gallery-caption{display:flex;justify-content:space-between;align-items:center;padding:10px 4px 3px;font:9px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.changelog-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.update-card{position:relative;display:grid;grid-template-columns:90px 1fr;gap:18px;min-height:170px;padding:22px;background:var(--surface);border:1px solid var(--line);border-radius:4px;transition:transform .2s,border-color .2s}
.update-card:hover{transform:translateY(-4px);border-color:var(--accent)}
.update-version{font:700 11px var(--mono);color:var(--accent);padding-top:3px}
.update-card h3{font-size:19px;line-height:1.2;letter-spacing:-.04em;margin:0 0 7px}
.update-card p{font-size:13px;color:var(--muted);line-height:1.7;margin:0}
.update-date{display:block;font:9px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--coral);margin-bottom:12px}
.faq-list{border-top:1px solid var(--ink)}
.faq-item{border-bottom:1px solid var(--line)}
.faq-question{width:100%;display:flex;justify-content:space-between;align-items:center;gap:18px;padding:23px 2px;border:0;background:transparent;color:var(--ink);font:600 17px var(--display);text-align:left;cursor:pointer}
.faq-question span:last-child{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;font-size:18px;color:var(--accent);transition:transform .2s,border-color .2s}
.faq-item.open .faq-question span:last-child{transform:rotate(45deg);border-color:var(--accent)}
.faq-answer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .25s ease}
.faq-answer-inner{overflow:hidden;color:var(--muted);font-size:14px;line-height:1.8;max-width:720px;padding:0 42px 0 2px}
.faq-item.open .faq-answer{grid-template-rows:1fr}
.faq-item.open .faq-answer-inner{padding-bottom:21px}
.other-apps-section{padding:64px 0;border-bottom:1px solid var(--line)}
.other-apps-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;font:700 10px var(--mono);letter-spacing:.12em;text-transform:uppercase}
.other-apps-header svg{color:var(--coral)}
.other-apps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.other-app-card{padding:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:13px;min-width:0}
.other-app-icon{width:48px;height:48px;object-fit:cover;border-radius:12px;background:var(--surface-2);flex-shrink:0}
.other-app-name{font-size:13px;font-weight:700;flex:1;min-width:0;word-break:break-word}
.other-app-download{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;color:var(--accent);font:700 9px var(--mono);text-transform:uppercase;text-decoration:none}
.other-app-download.disabled{color:var(--muted);pointer-events:none}
.app-detail-page{display:grid;gap:18px;padding:30px 0 80px}
.app-detail-back{width:max-content;text-decoration:none;color:var(--muted);font:700 10px var(--mono);text-transform:uppercase}
.app-detail-hero,.app-detail-review{padding:30px;background:var(--surface);border:1px solid var(--line)}
.app-detail-hero{display:flex;align-items:center;gap:22px}
.app-detail-icon{width:80px;height:80px;border-radius:18px;object-fit:cover}
.app-detail-title{font-size:clamp(36px,6vw,68px);line-height:1;letter-spacing:-.08em;margin:6px 0 12px}
.app-detail-category{font:700 10px var(--mono);color:var(--accent);text-transform:uppercase}
.app-detail-review h2{font-size:27px;letter-spacing:-.05em;margin:0 0 10px}
.app-detail-review p{max-width:720px;color:var(--muted);line-height:1.8}
.app-detail-features{display:grid;gap:10px;margin:20px 0}
.app-detail-feature::before{content:"↗";color:var(--coral);margin-right:10px}
.app-detail-actions{margin-top:22px}
.site-footer{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;padding:35px 0 42px;color:var(--muted)}
.footer-brand{font-size:18px;font-weight:800;letter-spacing:-.06em;color:var(--ink)}
.footer-note{font:9px var(--mono);text-transform:uppercase;letter-spacing:.1em;margin-top:5px}
.footer-links{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end}
.footer-links a{font:9px var(--mono);letter-spacing:.07em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:4px}
.lightbox{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px;background:rgba(10,12,10,.9);opacity:0;visibility:hidden;transition:.2s}
.lightbox.open{opacity:1;visibility:visible}
.lightbox img{max-width:min(900px,92vw);max-height:84vh;border:6px solid var(--paper);box-shadow:0 24px 80px rgba(0,0,0,.5)}
.lightbox-close{position:absolute;top:18px;right:20px;width:46px;height:46px;background:var(--paper);border:0;border-radius:50%;color:#171917;font-size:26px;cursor:pointer}
.footer{display:none}
[hidden]{display:none!important}
@media(max-width:960px){
  .site-shell{width:min(100% - 36px,1240px)}
  .desktop-nav{gap:16px}
  .hero-section{grid-template-columns:minmax(0,1fr) minmax(320px,.85fr);gap:34px}
  .hero-visual{min-height:490px}
  .phone-shell{height:min(390px,76%)}
  .toolkit-band{grid-template-columns:repeat(4,1fr)}
  .band-intro{font-size:12px}
  .other-apps-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:720px){
  .site-header{grid-template-columns:1fr auto;min-height:72px}
  .desktop-nav{display:none}
  #menuBtn{display:grid}

/* ---------- Utilities ---------- */

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function safeUrl(url) {
  if (!url || typeof url !== "string") return "#";

  try {
    const parsed = new URL(url, window.location.href);
    return ["http:", "https:"].includes(parsed.protocol)
      ? parsed.href
      : "#";
  } catch {
    return "#";
  }
}

function appSlug(app) {
  const raw = String(app.slug || app.name || "app").toLowerCase().trim();
  return raw.replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "app";
}

function appRoute(app) {
  return "/" + appSlug(app);
}

function getLang() {
  return document.body.getAttribute("lang-current") === "my" ? "my" : "en";
}

/* ---------- Theme ---------- */

function toggleTheme() {
  const html = document.documentElement;
  const current = html.getAttribute("data-theme");
  const next = current === "light" ? "dark" : "light";

  html.setAttribute("data-theme", next);

  try {
    localStorage.setItem("theme", next);
  } catch(e) {}
}

/* ---------- Language ---------- */

function toggleLanguage() {
  const body = document.body;
  const next = getLang() === "en" ? "my" : "en";

  body.setAttribute("lang-current", next);

  try {
    localStorage.setItem("lang", next);
  } catch(e) {}

  updateUITexts(next);
  renderMainApp(next);
  renderExtraSections(next);
  loadOtherApps(next);
}

function updateUITexts(lang) {
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");

    if (i18n[lang] && i18n[lang][key]) {
      el.textContent = i18n[lang][key];
    }
  });
}

/* ---------- Drawer ---------- */

function toggleDrawer(show) {
  const drawer = document.getElementById("drawer");
  drawer.classList.toggle("open", show);
  drawer.setAttribute("aria-hidden", String(!show));
  document.getElementById("drawerScrim").classList.toggle("open", show);
  document.body.style.overflow = show ? "hidden" : "";
}

/* ---------- Main App ---------- */

        <p class="hero-description">${escapeHTML(dict.heroBody)}</p>
        <div class="hero-actions">
          <a href="${buttonLink}" class="${btnClass}" aria-label="${escapeHTML(btnText + ' ' + data.appName)}" ${isAvailable ? 'target="_blank" rel="noopener noreferrer"' : 'aria-disabled="true"'}>
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">${downloadIcon}</svg>${escapeHTML(btnText)}
          </a>
          <a class="text-link" href="#features">${escapeHTML(dict.exploreCta)} <span aria-hidden="true">↘</span></a>

        <div class="hero-meta" aria-label="${escapeHTML(data.appName)} details">
          <div class="hero-meta-item"><span class="meta-label">${escapeHTML(dict.latestBuild)}</span><span class="meta-value">v${escapeHTML(data.version)}</span></div>
          <div class="hero-meta-item"><span class="meta-label">${escapeHTML(dict.platformLabel)}</span><span class="meta-value">${escapeHTML(dict.platformValue)}</span></div>
          <div class="hero-meta-item"><span class="meta-label">${escapeHTML(dict.sizeLabel)}</span><span class="meta-value">${escapeHTML(fileSize)}</span></div>
        </div>
      </div>
      <div class="hero-visual" aria-label="${escapeHTML(data.appName)} app preview">
        <span class="visual-index">XONI <strong>— 01</strong></span>
        <span class="visual-side-note">${escapeHTML(dict.visualLabel)}</span>

    </div>
    <div class="gallery-grid">
      ${appData.screenshots.map((src, index) => `
        <button class="gallery-item" type="button" data-gallery-src="${escapeHTML(safeUrl(src))}" aria-label="${escapeHTML(dict.screenshotsTitle)} ${index + 1}">
          <img loading="lazy" src="${escapeHTML(safeUrl(src))}" alt="XoniTools screenshot ${index + 1}">

    </div>

      `).join("")}

  `;

  faq.innerHTML = `
    <div class="section-heading">
      <div><h2 id="faqTitle">${escapeHTML(dict.faqTitle)}</h2><p>${escapeHTML(dict.faqSubtitle)}</p></div>
    </div>
    <div class="faq-list">
      ${appData.faqs.map((item, index) => `
        <article class="faq-item">
          <button class="faq-question" type="button" aria-expanded="false" aria-controls="faq-answer-${index}">
            <span>${escapeHTML(lang === "en" ? item.qEN : item.qMM)}</span><span aria-hidden="true">+</span>
          </button>
          <div class="faq-answer" id="faq-answer-${index}"><div class="faq-answer-inner">${escapeHTML(lang === "en" ? item.aEN : item.aMM)}</div></div>

  `;

function setupExtraSectionEvents() {
  document.addEventListener("click", event => {
    const galleryButton = event.target.closest("[data-gallery-src]");
    if (galleryButton) {
      const lightbox = document.getElementById("lightbox");
      const image = document.getElementById("lightboxImage");
      image.src = galleryButton.dataset.gallerySrc;
      lightbox.classList.add("open");
      document.body.style.overflow = "hidden";
      return;
    }

    const faqButton = event.target.closest(".faq-question");
    if (faqButton) {
      const item = faqButton.closest(".faq-item");
      const open = item.classList.toggle("open");
      faqButton.setAttribute("aria-expanded", String(open));
    }
  });

  const closeLightbox = () => {
    document.getElementById("lightbox").classList.remove("open");
    document.getElementById("lightboxImage").removeAttribute("src");
    document.body.style.overflow = "";
  };
  document.getElementById("lightboxClose").addEventListener("click", closeLightbox);
  document.getElementById("lightbox").addEventListener("click", event => {
    if (event.target.id === "lightbox") closeLightbox();
  });
  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeLightbox();
  });
}

/* ---------- Other Apps ---------- */

function renderAppDetail(app, lang) {
  const main = document.getElementById("mainContent");
  const container = document.getElementById("otherAppsContainer");
  const dict = i18n[lang];
  const name = escapeHTML(app.name || "App");
  const icon = escapeHTML(app.icon || "");
  const externalLink = safeUrl(app.link || "");
  const description = lang === "en" ? (app.description || "Explore this app and open its official download source.") : (app.descriptionMM || app.description || "App information နှင့် official download source ကိုကြည့်ရှုနိုင်ပါသည်။");
  const featureList = (lang === "en" ? app.features : app.featuresMM) || app.features || [];
  const version = escapeHTML(app.version || "Latest");
  const category = escapeHTML(app.category || "Android Utility Tools");

  document.title = `${app.name || "App"} · XoniTools`;
  container.hidden = true;
  container.innerHTML = "";
  ["screenshots", "updates", "faq"].forEach(id => {
    document.getElementById(id).hidden = true;
  });

  main.innerHTML = `
    <div class="app-detail-page">
      <a class="app-detail-back" href="/">← ${escapeHTML(dict.backHome || "Back to Home")}</a>
      <section class="app-detail-hero glass-panel">
        <img class="app-detail-icon" src="${icon}" alt="${name}" onerror="this.style.display='none'">
        <div>
          <div class="app-detail-category">${category}</div>
          <h1 class="app-detail-title">${name}</h1>
          <div class="chip-group">
            <span class="m3-chip">v${version}</span>
            <span class="m3-chip status-online"><span class="status-dot"></span>${escapeHTML(dict.statusAvail)}</span>
          </div>
        </div>
      </section>
      <section class="app-detail-review glass-panel">
        <h2>${escapeHTML(dict.appReviewTitle || "App Review")}</h2>
        <p>${escapeHTML(description)}</p>
        ${featureList.length ? `<div class="app-detail-features">${featureList.map(item => `<div class="app-detail-feature">${escapeHTML(item)}</div>`).join("")}</div>` : ""}
        <div class="app-detail-actions">
          <a class="m3-download-btn" href="${externalLink}" target="_blank" rel="noopener noreferrer">
            ${escapeHTML(dict.reviewDownload || "Review & Download")}
          </a>
        </div>
      </section>
    </div>
  `;
}

function renderOtherApps(apps, lang) {
  const container = document.getElementById("otherAppsContainer");
  const dict = i18n[lang];

  if (!Array.isArray(apps) || apps.length === 0) {
    container.hidden = true;
    container.innerHTML = "";
    return;
  }

  const cardsHTML = apps.map(app => {
    const available = app.available !== false;
    const name = escapeHTML(app.name || "App");
    const icon = escapeHTML(app.icon || "");
    const link = available ? appRoute(app) : "#";
    const text = available
      ? (dict.reviewDownload || dict.otherDownload)
      : dict.otherUnavailable;

    return `
      <div class="other-app-card glass-panel">

        <img
          loading="lazy"
          src="${icon}"
          alt="${name}"
          class="other-app-icon"
          onerror="this.style.display='none'"
        >

        <div class="other-app-name">${name}</div>

        <a
          href="${available ? link : "#"}"
          class="other-app-download ${available ? "" : "disabled"}"
          ${available && link !== "#" ? "" : ""}
        >
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="14">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          ${escapeHTML(text)}
        </a>

      </div>
    `;
  }).join("");

  container.hidden = false;

  container.innerHTML = `
    <div class="other-apps-header">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" width="22">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      ${escapeHTML(dict.otherAppsTitle)}
    </div>

    <div class="other-apps-grid">
      ${cardsHTML}
    </div>
  `;
}

async function loadOtherApps(lang) {
  const container = document.getElementById("otherAppsContainer");

  try {
    const response = await fetch("./otherapps.json", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    const apps = Array.isArray(data)
      ? data
      : Array.isArray(data.apps)
        ? data.apps
        : [];

    const requestedSlug = window.location.pathname.replace(/^\/+|\/+$/g, "").toLowerCase();
    const detailApp = requestedSlug && requestedSlug !== "index.html"
      ? apps.find(app => appSlug(app) === requestedSlug)
      : null;

    if (detailApp) {
      renderAppDetail(detailApp, lang);
    } else {
      renderOtherApps(apps, lang);
    }

  } catch (error) {
    console.warn("otherapps.json could not be loaded:", error);

    /* JSON မရှိရင် section ကိုဖျောက်ထားမယ် */
    container.hidden = true;
    container.innerHTML = "";
  }
}

/* ---------- Events ---------- */

document.getElementById("themeBtn").addEventListener("click", toggleTheme);
document.getElementById("languageBtn").addEventListener("click", toggleLanguage);
document.getElementById("menuBtn").addEventListener("click", () => toggleDrawer(true));
document.getElementById("drawerScrim").addEventListener("click", () => toggleDrawer(false));

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    toggleDrawer(false);
  }
});

/* ---------- Init ---------- */

function init() {
  const lang = getLang();

  updateUITexts(lang);
  renderMainApp(lang);
  renderExtraSections(lang);
  setupExtraSectionEvents();
  loadOtherApps(lang);
}

document.addEventListener("DOMContentLoaded", init);
</script></body>
